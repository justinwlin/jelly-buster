<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#76c3ff" />
    <meta name="description" content="Send jellies around the belt to munch every cube of the picture. Plays offline on phone and desktop." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Jelly Buster" />
    <link rel="icon" href="./icons/favicon-64.png" type="image/png" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <title>Jelly Buster</title>
  </head>
  <body>
    <canvas id="game" aria-label="Game board"></canvas>
    <div id="hud" class="hidden">
      <div class="coins"><i class="coin" id="hud-coin-icon"></i><b id="hud-coins">0</b></div>
      <div class="lvl-wrap">
        <div class="lvl" id="hud-level">Level 1</div>
        <div class="progress" aria-label="Picture cleared"><div id="hud-bar"></div></div>
      </div>
      <div class="hud-right">
      <div class="lives" aria-label="Lives"><svg class="heart" viewBox="0 0 24 22" aria-hidden="true"><path d="M12 21.2 10.4 19.8C4.6 14.6 1 11.3 1 7.2 1 3.9 3.6 1.3 6.9 1.3c1.9 0 3.7.9 5.1 2.3 1.4-1.4 3.2-2.3 5.1-2.3 3.3 0 5.9 2.6 5.9 5.9 0 4.1-3.6 7.4-9.4 12.6Z"/><ellipse cx="7" cy="6.4" rx="2.6" ry="1.6" fill="#fff" opacity=".55" transform="rotate(-30 7 6.4)"/></svg><b id="hud-lives" class="js-lives">3</b></div>
      <button id="btn-pause" class="icon-btn" aria-label="Pause">
        <svg viewBox="0 0 24 24" width="22" height="22"><rect x="6" y="5" width="4" height="14" rx="1.5" fill="currentColor"/><rect x="14" y="5" width="4" height="14" rx="1.5" fill="currentColor"/></svg>
      </button>
      </div>
    </div>
    <div id="boosters" class="boosters hidden" aria-label="Boosters"></div>
    <div id="aimhint" class="aimhint hidden" aria-live="polite"></div>
    <div id="tip" class="tip hidden"><canvas class="tip-face" width="120" height="120"></canvas><p></p></div>
    <div id="screen" class="screen hidden"></div>
    <div id="toast" class="toast hidden"></div>
    <div id="ff" class="ff hidden" aria-live="polite">⏩ Fast-forward</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
